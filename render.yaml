services:
  - type: web
    name: socra-backend
    runtime: python
    plan: free
    buildCommand: npm ci --prefix socra --omit=dev && python -m pip install uv==0.11.6 && cd socra-backend && python -m uv sync --locked --no-dev
    startCommand: cd socra-backend && .venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: LOG_LEVEL
        value: INFO
